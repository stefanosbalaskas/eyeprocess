name: Tighten CRAN return documentation quality

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-return-quality-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::roxygen2
      - name: Tighten source-level return contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("R/061-pupil-advanced-representations-0-8.R")
          text = src.read_text(encoding="utf-8")
          replacements = {
              "#' @return An R object containing confound-adjusted pupil values. The concrete class and structure follow the selected method, engine, or input object and are preserved as documented by that workflow.":
              "#' @return A data frame containing the fitted model data, including `pupil_confound_residual` and `pupil_confound_adjusted` columns.",
              "#' @return An R object containing pupil confound-model effects. The concrete class and structure follow the selected method, engine, or input object and are preserved as documented by that workflow.":
              "#' @return A numeric coefficient table: the smooth-term table for `mgcv::gam()` fits or the coefficient matrix for `stats::lm()` fits.",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"return-doc anchor count={text.count(old)} for {old}")
              text = text.replace(old, new, 1)
          src.write_text(text, encoding="utf-8")

          report = Path("CRAN_REMEDIATION_REPORT.md")
          rtext = report.read_text(encoding="utf-8")
          old = '- `adjust_pupil_confounds`: An R object containing confound-adjusted pupil values. The concrete class and structure follow the selected method, engine, or input object and are preserved as documented by that workflow.'
          new = '- `adjust_pupil_confounds`: A data frame containing the fitted model data, including `pupil_confound_residual` and `pupil_confound_adjusted` columns.'
          if rtext.count(old) != 1:
              raise SystemExit(f"report anchor count={rtext.count(old)}")
          report.write_text(rtext.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Regenerate manuals
        run: Rscript -e 'roxygen2::roxygenise(".", roclets = c("rd", "namespace"))'
      - name: Verify tightened contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          adjust = Path("man/adjust_pupil_confounds.Rd").read_text(encoding="utf-8")
          effects = Path("man/pupil_confound_effects.Rd").read_text(encoding="utf-8")
          assert "A data frame containing the fitted model data" in adjust
          assert "pupil_confound_residual" in adjust and "pupil_confound_adjusted" in adjust
          assert "A numeric coefficient table" in effects
          assert "\\code{mgcv::gam()}" in effects
          assert "\\code{stats::lm()}" in effects
          print("TIGHTENED_RETURN_CONTRACTS=PASS")
          PY
          python tools/cran_policy_audit.py
          git diff --check
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/cran-return-quality-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A R/061-pupil-advanced-representations-0-8.R man/adjust_pupil_confounds.Rd man/pupil_confound_effects.Rd NAMESPACE CRAN_REMEDIATION_REPORT.md .github/workflows/cran-return-quality-fix.yml
          git commit -m "docs: tighten pupil confound return contracts"
          git push origin HEAD:cran-remediation-0.11.1
