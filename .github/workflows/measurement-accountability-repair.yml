name: Measurement accountability repair

on:
  push:
    paths:
      - .github/workflows/measurement-accountability-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair lifecycle registry and validation ladder
        shell: python
        run: |
          import csv
          from pathlib import Path

          source = Path("R/113-measurement-accountability-0-11.R")
          text = source.read_text(encoding="utf-8")
          old = '''  stages <- c(acquisition_qc = acquisition_qc, analytical_qc = analytical_qc,
                        construct_check = construct_check, within_person = within_person,
                        held_out_person = held_out_person)
            stages <- tolower(gsub("-", "_", as.character(stages)))
            valid <- c("pass", "warning", "fail", "not_assessed")
            if (any(!stages %in% valid)) stop("Stage status must be pass, warning, fail, or not_assessed.", call. = FALSE)
            general <- tolower(gsub("-", "_", claim)) %in% c("generalizable", "generalization", "out_of_person", "population")
            held <- unname(stages["held_out_person"]) == "pass"
          '''
          new = '''  stages <- c(acquisition_qc = acquisition_qc, analytical_qc = analytical_qc,
                        construct_check = construct_check, within_person = within_person,
                        held_out_person = held_out_person)
            stage_names <- names(stages)
            stages <- tolower(gsub("-", "_", as.character(stages)))
            names(stages) <- stage_names
            valid <- c("pass", "warning", "fail", "not_assessed")
            if (any(!stages %in% valid)) stop("Stage status must be pass, warning, fail, or not_assessed.", call. = FALSE)
            general <- isTRUE(tolower(gsub("-", "_", as.character(claim)[1L])) %in%
                              c("generalizable", "generalization", "out_of_person", "population"))
            held <- identical(unname(stages[["held_out_person"]]), "pass")
          '''
          if old not in text:
              raise SystemExit("validation_ladder target block was not found exactly")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry_path = Path("inst/extdata/api-lifecycle-registry-0.9.csv")
          with registry_path.open(newline="", encoding="utf-8") as fh:
              reader = csv.DictReader(fh)
              registry = list(reader)
              fields = reader.fieldnames
          if len(registry) != 1182:
              raise SystemExit(f"expected 1182 lifecycle rows before repair, found {len(registry)}")
          additions = {
              "event_marker_qc": "Event-marker plausibility QC; explicitly does not establish clock synchronization or construct validity.",
              "pupil_latency_sensitivity": "Estimator-sensitivity and resolvability diagnostic; does not establish hardware-independent latency or construct validity.",
              "validation_ladder": "Measurement-to-generalization evidence diagnostic; held-out-person evidence gates generalization claims and does not establish construct validity.",
          }
          existing = {row["name"] for row in registry}
          overlap = existing.intersection(additions)
          if overlap:
              raise SystemExit(f"lifecycle rows unexpectedly already present: {sorted(overlap)}")
          for name, note in additions.items():
              registry.append({
                  "name": name,
                  "status": "advanced",
                  "canonical": "",
                  "replacement": "",
                  "since": "0.11.1",
                  "notes": note,
              })
          with registry_path.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=fields, quoting=csv.QUOTE_ALL, lineterminator="\n")
              writer.writeheader()
              writer.writerows(registry)

          policy_path = Path("inst/extdata/api-lifecycle-module-policy-0.9.csv")
          with policy_path.open(newline="", encoding="utf-8") as fh:
              reader = csv.DictReader(fh)
              policy = list(reader)
              policy_fields = reader.fieldnames
          module = "R/113-measurement-accountability-0-11.R"
          if len(policy) != 108:
              raise SystemExit(f"expected 108 lifecycle-policy rows before repair, found {len(policy)}")
          if any(row["source_file"] == module for row in policy):
              raise SystemExit("measurement-accountability module policy unexpectedly already present")
          policy.append({
              "source_file": module,
              "status": "advanced",
              "rationale": "Specialist measurement-accountability diagnostics for estimator sensitivity, event plausibility, and evidence-to-generalization gating; outputs do not establish construct validity.",
          })
          with policy_path.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=policy_fields, quoting=csv.QUOTE_ALL, lineterminator="\n")
              writer.writeheader()
              writer.writerows(policy)

          tests = Path("tests/testthat/test-0-9-api-lifecycle.R")
          text = tests.read_text(encoding="utf-8")
          if "expect_equal(nrow(reg), 1182L)" not in text or "expect_equal(nrow(policy), 108L)" not in text:
              raise SystemExit("lifecycle count invariants did not match expected pre-repair values")
          text = text.replace("expect_equal(nrow(reg), 1182L)", "expect_equal(nrow(reg), 1185L)", 1)
          text = text.replace("expect_equal(nrow(policy), 108L)", "expect_equal(nrow(policy), 109L)", 1)
          tests.write_text(text, encoding="utf-8")
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/113-measurement-accountability-0-11.R \
                  inst/extdata/api-lifecycle-registry-0.9.csv \
                  inst/extdata/api-lifecycle-module-policy-0.9.csv \
                  tests/testthat/test-0-9-api-lifecycle.R
          git diff --cached --check
          git commit -m "fix: close measurement-accountability validation contracts"
          git push
