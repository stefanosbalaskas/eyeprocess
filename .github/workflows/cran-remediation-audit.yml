name: CRAN remediation audit

on:
  push:
    branches:
      - cran-remediation-0.11.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit CRAN manual-review findings
        run: python tools/cran_policy_audit.py
      - name: Audit missing return documentation (legacy heuristic)
        run: python tools/cran_return_docs.py
      - name: Audit missing return documentation (terminal-expression analyzer)
        run: python tools/cran_return_docs_v2.py
