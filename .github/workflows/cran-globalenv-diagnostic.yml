name: CRAN docs gate diagnostic

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-globalenv-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-generated-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cran-remediation-0.11.1
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::roxygen2

      - name: Reproduce return documentation generation
        shell: bash
        run: |
          python tools/cran_return_docs_v2.py --apply > /tmp/return-inference.txt
          Rscript -e 'roxygen2::roxygenise(".", roclets = c("rd", "namespace"))'

      - name: Capture exact verification evidence
        shell: bash
        run: |
          set +e
          python tools/cran_policy_audit.py > /tmp/policy.txt 2>&1
          POLICY_STATUS=$?
          export POLICY_STATUS
          python - <<'PY'
          import os
          from pathlib import Path

          policy = Path('/tmp/policy.txt').read_text(encoding='utf-8', errors='replace')
          inference = Path('/tmp/return-inference.txt').read_text(encoding='utf-8', errors='replace')
          missing = []
          for rd in sorted(Path('man').glob('*.Rd')):
              text = rd.read_text(encoding='utf-8', errors='replace')
              if '\\value{' not in text:
                  missing.append(rd.name)

          hits = []
          for root in ['R', 'man', 'vignettes', 'inst', 'demo', 'examples']:
              p = Path(root)
              if not p.exists():
                  continue
              for f in sorted(x for x in p.rglob('*') if x.is_file()):
                  try:
                      lines = f.read_text(encoding='utf-8').splitlines()
                  except (UnicodeDecodeError, OSError):
                      continue
                  for i, line in enumerate(lines, 1):
                      if 'globalenv()' in line or '.GlobalEnv' in line or 'install.packages' in line:
                          hits.append(f'{f}:{i}:{line}')

          out = Path('CRAN_DOC_GATE_DIAGNOSTIC.txt')
          out.write_text(
              f"POLICY_STATUS={os.environ.get('POLICY_STATUS', 'unknown')}\n"
              + '--- POLICY OUTPUT ---\n' + policy
              + f"\n--- MISSING VALUE TAGS ({len(missing)}) ---\n"
              + ('\n'.join(missing) if missing else 'NONE')
              + f"\n--- DIRECT POLICY TOKEN HITS ({len(hits)}) ---\n"
              + ('\n'.join(hits) if hits else 'NONE')
              + '\n--- RETURN INFERENCE TAIL ---\n'
              + '\n'.join(inference.splitlines()[-40:]) + '\n',
              encoding='utf-8'
          )
          print(out.read_text(encoding='utf-8'))
          PY
          exit 0

      - name: Commit diagnostic evidence only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CRAN_DOC_GATE_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture exact CRAN docs gate diagnostics"
          git push origin HEAD:cran-remediation-0.11.1
