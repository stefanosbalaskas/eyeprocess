name: CRAN globalenv diagnostic

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-globalenv-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cran-remediation-0.11.1
          fetch-depth: 0

      - name: Scan CRAN-shipped surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = ["R", "man", "vignettes", "inst", "demo", "examples"]
          hits = []
          for root in roots:
              p = Path(root)
              if not p.exists():
                  continue
              for f in sorted(x for x in p.rglob("*") if x.is_file()):
                  try:
                      lines = f.read_text(encoding="utf-8").splitlines()
                  except (UnicodeDecodeError, OSError):
                      continue
                  for i, line in enumerate(lines, 1):
                      if "globalenv()" in line or ".GlobalEnv" in line:
                          hits.append(f"{f}:{i}:{line}")

          out = Path("CRAN_GLOBALENV_DIAGNOSTIC.txt")
          out.write_text("\n".join(hits) + ("\n" if hits else "NO_HITS\n"), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CRAN_GLOBALENV_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture CRAN globalenv diagnostics"
          git push origin HEAD:cran-remediation-0.11.1
