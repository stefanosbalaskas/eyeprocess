name: Repair pkgdown reference index

on:
  push:
    paths:
      - '.github/workflows/repair-pkgdown-reference.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register measurement accountability reference topics
        shell: python
        run: |
          from pathlib import Path
          path = Path('_pkgdown.yml')
          text = path.read_text(encoding='utf-8')
          topics = ['pupil_latency_sensitivity', 'event_marker_qc', 'validation_ladder']
          if all(topic in text for topic in topics):
              print('All measurement accountability topics already registered; no change required.')
          else:
              if any(topic in text for topic in topics):
                  raise SystemExit('Partial reference registration detected; refusing automatic edit.')
              needle = 'reference:\n'
              if text.count(needle) != 1:
                  raise SystemExit('Expected exactly one reference index anchor; refusing to edit.')
              replacement = (
                  'reference:\n'
                  '- title: Measurement accountability diagnostics (0.11)\n'
                  '  contents:\n'
                  '  - pupil_latency_sensitivity\n'
                  '  - event_marker_qc\n'
                  '  - validation_ladder\n'
              )
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Commit repair
        run: |
          if git diff --quiet -- _pkgdown.yml; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _pkgdown.yml
          git commit -m 'docs: register measurement accountability reference topics'
          git push
