name: advanced-model-contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/02[3-9]-*.R'
      - 'inst/stan/**'
      - 'tests/testthat/*v2.R'
      - '.github/workflows/advanced-model-contracts.yaml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::jsonlite
      - name: Test contracts without optional engines
        shell: Rscript {0}
        run: |
          devtools::test(filter = 'v2')
      - name: Validate benchmark
        shell: Rscript {0}
        run: |
          devtools::load_all()
          stopifnot(validate_benchmark_study()$valid)
          stopifnot(run_benchmark_reproduction()$passed)
