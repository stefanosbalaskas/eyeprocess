name: Measurement docs sync

on:
  push:
    branches: [master]
    paths:
      - 'R/113-measurement-accountability-0-11.R'
      - '.github/workflows/measurement-docs-sync.yml'

permissions:
  contents: write

jobs:
  roxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependency for fs
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - name: Install roxygen2
        run: Rscript -e 'install.packages("roxygen2", repos="https://cloud.r-project.org")'
      - name: Regenerate Rd files
        run: Rscript -e 'roxygen2::roxygenise()'
      - name: Enforce measurement public API
        shell: bash
        run: |
          for fn in pupil_latency_sensitivity event_marker_qc validation_ladder; do
            grep -qxF "export(${fn})" NAMESPACE || printf 'export(%s)\n' "$fn" >> NAMESPACE
          done
      - name: Verify measurement public API
        shell: bash
        run: |
          grep -qxF 'export(pupil_latency_sensitivity)' NAMESPACE
          grep -qxF 'export(event_marker_qc)' NAMESPACE
          grep -qxF 'export(validation_ladder)' NAMESPACE
      - name: Commit generated documentation and exports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NAMESPACE man
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchronize measurement public API"
            git push
          fi
