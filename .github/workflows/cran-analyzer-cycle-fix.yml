name: Fix CRAN analyzer assignment cycles

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-analyzer-cycle-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch assignment-cycle handling exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/cran_return_docs_v2.py")
          text = path.read_text(encoding="utf-8")

          old_symbol = '''    if re.fullmatch(r"[A-Za-z.][A-Za-z0-9._]*", expr):
              if expr in assigns:
                  return infer_expr(assigns[expr], assigns, funcs, seen)
          '''
          new_symbol = '''    if re.fullmatch(r"[A-Za-z.][A-Za-z0-9._]*", expr):
              if expr in assigns:
                  marker = f"assign:{expr}"
                  if marker in seen:
                      return ReturnInfo("object", [], [], compact, "assignment-cycle")
                  return infer_expr(assigns[expr], assigns, funcs, seen | {marker})
          '''
          if text.count(old_symbol) != 1:
              raise SystemExit(f"symbol assignment anchor count={text.count(old_symbol)}")
          text = text.replace(old_symbol, new_symbol, 1)

          old_subset = '''        if base in assigns:
              base_info = infer_expr(assigns[base], assigns, funcs, seen)
              if base_info.kind in {"data.frame", "matrix", "array", "tabular"}:
                  return ReturnInfo(base_info.kind, base_info.classes, base_info.components, compact, "terminal-subset")
          '''
          new_subset = '''        if base in assigns:
              marker = f"assign:{base}"
              if marker not in seen:
                  base_info = infer_expr(assigns[base], assigns, funcs, seen | {marker})
                  if base_info.kind in {"data.frame", "matrix", "array", "tabular"}:
                      return ReturnInfo(base_info.kind, base_info.classes, base_info.components, compact, "terminal-subset")
          '''
          if text.count(old_subset) != 1:
              raise SystemExit(f"subset assignment anchor count={text.count(old_subset)}")
          text = text.replace(old_subset, new_subset, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile and regression-test cycle handling
        run: |
          python -m py_compile tools/cran_return_docs_v2.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/cran_return_docs_v2.py")
          spec = importlib.util.spec_from_file_location("cran_return_docs_v2", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          cyc = {"out": "out[order(-score), , drop = FALSE]"}
          info = mod.infer_expr("out", cyc, {}, set())
          assert info.kind == "tabular", info

          direct = mod.infer_expr("x", {"x": "x"}, {}, set())
          assert direct.kind == "object" and direct.confidence == "assignment-cycle", direct

          structured = {
              "df": "data.frame(a = 1)",
              "ranked": "df[order(-score), , drop = FALSE]",
          }
          ranked = mod.infer_expr("ranked", structured, {}, set())
          assert ranked.kind == "data.frame", ranked
          print("ASSIGNMENT_CYCLE_REGRESSIONS=PASS")
          PY

      - name: Re-run exact previously failing analyzer command
        shell: bash
        run: |
          python tools/cran_return_docs_v2.py --apply > /tmp/return-inference.txt
          tail -n 8 /tmp/return-inference.txt
          git restore --worktree --staged R man NAMESPACE 2>/dev/null || true

      - name: Remove disposable diagnostics and commit fix
        run: |
          rm -f analyzer-diagnostic.txt
          rm -f .github/workflows/cran-analyzer-diagnostic.yml
          rm -f .github/workflows/cran-analyzer-cycle-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/cran_return_docs_v2.py analyzer-diagnostic.txt .github/workflows/cran-analyzer-diagnostic.yml .github/workflows/cran-analyzer-cycle-fix.yml
          git commit -m "fix: guard CRAN return analyzer assignment cycles"
          git push origin HEAD:cran-remediation-0.11.1
