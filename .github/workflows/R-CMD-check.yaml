# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          - {os: windows-latest, r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          # R-devel is a core-compatibility lane. Optional Suggests are exercised
          # by the release/oldrel lanes so upstream development stacks (notably
          # transient rstan/StanHeaders mismatches) cannot mask eyeprocess checks.
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', dependencies: '"hard"', force-suggests: 'false'}
          - {os: ubuntu-latest,  r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1', dependencies: '"all"',  force-suggests: 'true'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force-suggests }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check
          dependencies: ${{ matrix.config.dependencies }}

      - name: Check package
        if: ${{ matrix.config.r != 'devel' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Check package (R-devel, retained output)
        if: ${{ matrix.config.r == 'devel' }}
        id: check-devel
        shell: Rscript {0}
        run: |
          options(crayon.enabled = TRUE)
          cat("LOGNAME=", Sys.info()[["user"]], "\n", sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          if (Sys.getenv("_R_CHECK_FORCE_SUGGESTS_", "") == "") Sys.setenv("_R_CHECK_FORCE_SUGGESTS_" = "false")
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")

          check_dir <- file.path(getwd(), "r-devel-check")
          dir.create(check_dir, recursive = TRUE, showWarnings = FALSE)
          failed <- TRUE

          tryCatch({
            check_results <- rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--as-cran"),
              build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
              error_on = "never",
              check_dir = check_dir
            )
            saveRDS(check_results, file.path(check_dir, "rcmdcheck-result.rds"))
            failed <- length(check_results$errors) > 0L || length(check_results$warnings) > 0L
            writeLines(
              c(
                paste0("errors=", length(check_results$errors)),
                paste0("warnings=", length(check_results$warnings)),
                paste0("notes=", length(check_results$notes))
              ),
              file.path(check_dir, "rcmdcheck-summary.txt")
            )
          }, error = function(e) {
            writeLines(conditionMessage(e), file.path(check_dir, "rcmdcheck-driver-error.txt"))
          })

          cat("failed=", if (failed) "true" else "false", "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - name: Show R-devel check diagnostics
        if: ${{ always() && matrix.config.r == 'devel' }}
        shell: bash
        run: |
          echo '::group::R-devel 00check/test logs'
          find r-devel-check -type f \( -name '00check.log' -o -name 'testthat.Rout*' -o -name '*.Rout.fail' -o -name 'rcmdcheck-summary.txt' -o -name 'rcmdcheck-driver-error.txt' \) -print -exec cat '{}' \; 2>/dev/null || true
          echo '::endgroup::'

      - name: Upload R-devel check results
        if: ${{ always() && matrix.config.r == 'devel' }}
        uses: actions/upload-artifact@v4
        with:
          name: r-devel-check-results
          path: r-devel-check
          if-no-files-found: error
          retention-days: 7

      - name: Preserve R-devel check failure
        if: ${{ always() && matrix.config.r == 'devel' && steps.check-devel.outputs.failed == 'true' }}
        shell: bash
        run: exit 1
