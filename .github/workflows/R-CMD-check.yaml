# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          - {os: windows-latest, r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          # R-devel is a core-compatibility lane. Optional Suggests are exercised
          # by the release/oldrel lanes so upstream development stacks (notably
          # transient rstan/StanHeaders mismatches) cannot mask eyeprocess checks.
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', dependencies: '"hard"', force-suggests: 'false'}
          - {os: ubuntu-latest,  r: 'release',  dependencies: '"all"',  force-suggests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1', dependencies: '"all"',  force-suggests: 'true'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force-suggests }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::ggplot2
          needs: check
          dependencies: ${{ matrix.config.dependencies }}

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
