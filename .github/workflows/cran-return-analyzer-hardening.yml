name: Harden CRAN return inference semantics

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-return-analyzer-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch return inference conservatively
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("tools/cran_return_docs_v2.py")
          text = path.read_text(encoding="utf-8")

          new_classes = r'''def classes_in(expr: str) -> list[str]:
              # Only accept literal class declarations. Dynamic expressions such as
              # class = c(paste0("eye_irt_", type, "_channel"), "eye_irt_channel")
              # must not be misreported as the literal fragments inside paste0().
              m = re.search(r"\bclass\s*=\s*(['\"])([^'\"]+)\1", expr, re.S)
              if m:
                  return [m.group(2)]
              m = re.search(r"\bclass\s*=\s*c\s*\(([^()]*)\)", expr, re.S)
              if not m:
                  return []
              body = m.group(1).strip()
              parts = [p.strip() for p in body.split(",") if p.strip()]
              parsed = [re.fullmatch(r"(['\"])([^'\"]+)\1", p) for p in parts]
              if not parsed or not all(parsed):
                  return []
              return [m.group(2) for m in parsed]
          '''
          new_classes = re.sub(r"^ {14}", "", new_classes, flags=re.M)
          text, n = re.subn(
              r"def classes_in\(expr: str\) -> list\[str\]:\n.*?(?=\n\ndef list_components)",
              lambda _: new_classes.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f"classes_in replacement count={n}")

          new_infer = r'''def infer_expr(expr: str, assigns: dict[str, str], funcs: dict[str, FunctionInfo], seen: set[str]) -> ReturnInfo:
              expr = expr.strip().rstrip(";")
              compact = re.sub(r"\s+", " ", expr)
              if re.fullmatch(r"[A-Za-z.][A-Za-z0-9._]*", expr):
                  if expr in assigns:
                      return infer_expr(assigns[expr], assigns, funcs, seen)
                  if expr in {"TRUE", "FALSE"}:
                      return ReturnInfo("logical", [], [], compact, "terminal")
                  if expr == "NULL":
                      return ReturnInfo("null", [], [], compact, "terminal")
                  return ReturnInfo("object", [], [], compact, "terminal-symbol")
              if re.fullmatch(r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?L?", expr):
                  return ReturnInfo("numeric", [], [], compact, "terminal")
              if expr in {"NA_real_", "NA_integer_"}:
                  return ReturnInfo("numeric", [], [], compact, "terminal")
              if expr == "NA_character_":
                  return ReturnInfo("character", [], [], compact, "terminal")
              if expr == "NA" or expr == "NA_logical_":
                  return ReturnInfo("logical", [], [], compact, "terminal")
              if (len(expr) >= 2 and expr[0] == expr[-1] and expr[0] in "'\""):
                  return ReturnInfo("character", [], [], compact, "terminal")

              name = call_name(expr)
              if name in {"invisible", "return"}:
                  args = split_call_args(expr)
                  if not args or args[0].strip() == "NULL":
                      return ReturnInfo("null", [], [], compact, "terminal")
                  return infer_expr(args[0], assigns, funcs, seen)

              cls = classes_in(expr)
              if name == "structure" and cls:
                  comps = list_components(expr)
                  kind = "data.frame" if "data.frame" in cls else ("list" if "list(" in expr else "classed")
                  return ReturnInfo(kind, cls, comps, compact, "terminal-class")
              if name == "structure" and not cls:
                  # Dynamic classes cannot be named reliably from source literals.
                  comps = list_components(expr)
                  return ReturnInfo("list" if "list(" in expr else "classed", [], comps, compact, "terminal-dynamic-class")

              if name in {"data.frame", "as.data.frame"}:
                  return ReturnInfo("data.frame", ["data.frame"], [], compact, "terminal")
              if name in {"list", "as.list"}:
                  return ReturnInfo("list", ["list"], list_components(expr), compact, "terminal")
              if name in {"matrix", "as.matrix"}:
                  return ReturnInfo("matrix", ["matrix"], [], compact, "terminal")
              if name in {"array", "as.array"}:
                  return ReturnInfo("array", ["array"], [], compact, "terminal")
              if name in {"factor", "as.factor"}:
                  return ReturnInfo("factor", ["factor"], [], compact, "terminal")

              numeric_calls = {
                  "as.numeric", "as.integer", "numeric", "integer", "double", "mean", "median", "sum", "prod", "min", "max", "var", "sd",
                  "quantile", "plogis", "qlogis", "pnorm", "qnorm", "dnorm", "runif", "rnorm", "rbinom", "rnbinom",
                  "sqrt", "exp", "log", "log1p", "expm1", "abs", "round", "floor", "ceiling", "signif",
                  "seq", "seq_len", "seq_along", "sample.int", "rowMeans", "colMeans", "rowSums", "colSums",
                  "length", "nrow", "ncol", "which", "match", "findInterval",
              }
              logical_calls = {"isTRUE", "identical", "all", "any", "is.na", "is.null", "is.finite", "is.infinite", "grepl", "nzchar"}
              character_calls = {"as.character", "character", "paste", "paste0", "sprintf", "format", "formatC", "normalizePath", "file.path", "basename", "dirname"}
              list_calls = {"lapply", "split", "uniroot", "optimize"}
              if name in numeric_calls:
                  return ReturnInfo("numeric", [], [], compact, "terminal-call")
              if name in logical_calls:
                  return ReturnInfo("logical", [], [], compact, "terminal-call")
              if name in character_calls:
                  return ReturnInfo("character", [], [], compact, "terminal-call")
              if name in list_calls:
                  return ReturnInfo("list", ["list"], [], compact, "terminal-call")
              if name in {"sample", "cor", "cov"}:
                  return ReturnInfo("object", [], [], compact, "terminal-call-polymorphic")
              if name in {"vapply", "sapply"}:
                  return ReturnInfo("vector-or-matrix", [], [], compact, "terminal-call")
              if name == "do.call" and re.search(r"\b(?:rbind|cbind)\b", expr):
                  return ReturnInfo("tabular", [], [], compact, "terminal-call")
              if name in {"rbind", "cbind"}:
                  return ReturnInfo("tabular", [], [], compact, "terminal-call")
              if name in {"ggplot", "qplot"} or "ggplot2::ggplot" in expr:
                  return ReturnInfo("ggplot", ["ggplot"], [], compact, "terminal-call")
              if name in {"writeLines", "write.table", "write.csv", "saveRDS", "save", "cat"}:
                  return ReturnInfo("null", [], [], compact, "terminal-side-effect")

              # Preserve the structure of terminal subsetting before looking for
              # arithmetic tokens inside the index expression.
              subset = re.match(r"^([A-Za-z.][A-Za-z0-9._]*)\s*\[", expr)
              if subset:
                  base = subset.group(1)
                  if base in assigns:
                      base_info = infer_expr(assigns[base], assigns, funcs, seen)
                      if base_info.kind in {"data.frame", "matrix", "array", "tabular"}:
                          return ReturnInfo(base_info.kind, base_info.classes, base_info.components, compact, "terminal-subset")
                  if re.search(r"\bdrop\s*=\s*FALSE\b", expr):
                      return ReturnInfo("tabular", [], [], compact, "terminal-subset")
                  return ReturnInfo("object", [], [], compact, "terminal-subset")

              # Infer simple terminal if/else expressions from both value branches.
              if expr.startswith("if ") or expr.startswith("if("):
                  simple_if = re.match(r"^if\s*\((.*?)\)\s*(.*?)\s+else\s+(.*)$", expr, re.S)
                  if simple_if:
                      infos = [infer_expr(simple_if.group(i).strip(), assigns, funcs, seen) for i in (2, 3)]
                      non_null = [x for x in infos if x.kind != "null"]
                      kinds = {x.kind for x in non_null}
                      if len(kinds) == 1 and non_null:
                          x = non_null[0]
                          return ReturnInfo(x.kind, x.classes, x.components, compact, "conditional")
                  returns = re.findall(r"return\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)", expr)
                  infos = [infer_expr(x, assigns, funcs, seen) for x in returns]
                  non_null = [x for x in infos if x.kind != "null"]
                  kinds = {x.kind for x in non_null}
                  if len(kinds) == 1 and non_null:
                      x = non_null[0]
                      return ReturnInfo(x.kind, x.classes, x.components, compact, "conditional")

              # Follow wrappers to another package function when its terminal expression is known.
              if name and name in funcs and name not in seen:
                  target = infer_function(name, funcs, seen | {name})
                  return ReturnInfo(target.kind, target.classes, target.components, compact, "wrapper->" + target.confidence)

              # Arithmetic/comparison expressions are common terminal expressions, but
              # only after structured subsetting and conditionals have been ruled out.
              if re.search(r"(?:==|!=|<=|>=|<|>|%in%|\&\&|\|\|)", expr):
                  return ReturnInfo("logical", [], [], compact, "terminal-expression")
              if re.search(r"(?:\+|-|\*|/|\^|%%|%/%)", expr) and not re.search(r"['\"]", expr):
                  return ReturnInfo("numeric", [], [], compact, "terminal-expression")

              return ReturnInfo("object", [], [], compact, "unresolved")
          '''
          new_infer = re.sub(r"^ {14}", "", new_infer, flags=re.M)
          text, n = re.subn(
              r"def infer_expr\(expr: str, assigns: dict\[str, str\], funcs: dict\[str, FunctionInfo\], seen: set\[str\]\) -> ReturnInfo:\n.*?(?=\n\ndef infer_function)",
              lambda _: new_infer.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f"infer_expr replacement count={n}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate analyzer syntax and regression semantics
        run: |
          python -m py_compile tools/cran_return_docs_v2.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          p = Path("tools/cran_return_docs_v2.py")
          spec = importlib.util.spec_from_file_location("cran_return_docs_v2_test", p)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          funcs = {}
          assert mod.classes_in('structure(x, class = c(paste0("eye_irt_", type, "_channel"), "eye_irt_channel"))') == []
          assert mod.classes_in('structure(x, class = c("a", "b"))') == ["a", "b"]
          assert mod.infer_expr('as.integer(4)', {}, funcs, set()).kind == "numeric"
          assert mod.infer_expr('uniroot(f, c(0, 1))', {}, funcs, set()).kind == "list"
          assert mod.infer_expr('sample(x)', {}, funcs, set()).kind == "object"
          assert mod.infer_expr('s[order(-s$score), , drop = FALSE]', {"s": 'data.frame(a = 1)'}, funcs, set()).kind == "data.frame"
          assert mod.infer_expr('if (length(z)) mean(z) else NA_real_', {}, funcs, set()).kind == "numeric"
          print("SEMANTIC_REGRESSION_TESTS=PASS")
          PY

      - name: Commit hardening and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cran-return-analyzer-hardening.yml
          git add tools/cran_return_docs_v2.py
          git diff --cached --check
          git commit -m "fix: harden CRAN return inference semantics"
          git push origin HEAD:cran-remediation-0.11.1
