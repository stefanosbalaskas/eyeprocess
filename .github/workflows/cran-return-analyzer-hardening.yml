name: Harden CRAN return inference semantics

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - .github/workflows/cran-return-analyzer-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch return inference conservatively
        run: |
          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          path = Path("tools/cran_return_docs_v2.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {n}")
              text = text.replace(old, new, 1)

          classes = textwrap.dedent(r'''
          def classes_in(expr: str) -> list[str]:
              # Only accept literal class declarations. Dynamic expressions such as
              # class = c(paste0("eye_irt_", type, "_channel"), "eye_irt_channel")
              # must not be misreported as literal fragments inside paste0().
              m = re.search(r"\bclass\s*=\s*(['\"])([^'\"]+)\1", expr, re.S)
              if m:
                  return [m.group(2)]
              m = re.search(r"\bclass\s*=\s*c\s*\(([^()]*)\)", expr, re.S)
              if not m:
                  return []
              parts = [p.strip() for p in m.group(1).split(",") if p.strip()]
              parsed = [re.fullmatch(r"(['\"])([^'\"]+)\1", p) for p in parts]
              if not parsed or not all(parsed):
                  return []
              return [p.group(2) for p in parsed]
          ''').lstrip()
          text, n = re.subn(
              r"def classes_in\(expr: str\) -> list\[str\]:\n.*?(?=\n\ndef list_components)",
              lambda _: classes.rstrip(), text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"classes_in replacement count={n}")

          replace_once(
              '    compact = re.sub(r"\\s+", " ", expr)\n    if re.fullmatch(r"[A-Za-z.][A-Za-z0-9._]*", expr):\n',
              '    compact = re.sub(r"\\s+", " ", expr)\n    if expr in {"NA_real_", "NA_integer_"}:\n        return ReturnInfo("numeric", [], [], compact, "terminal")\n    if expr == "NA_character_":\n        return ReturnInfo("character", [], [], compact, "terminal")\n    if expr in {"NA", "NA_logical_"}:\n        return ReturnInfo("logical", [], [], compact, "terminal")\n    if re.fullmatch(r"[A-Za-z.][A-Za-z0-9._]*", expr):\n',
              "NA scalar typing")

          replace_once(
              '        "as.numeric", "numeric", "double", "mean", "median", "sum", "prod", "min", "max", "var", "sd",',
              '        "as.numeric", "as.integer", "numeric", "integer", "double", "mean", "median", "sum", "prod", "min", "max", "var", "sd",',
              "integer call typing")
          replace_once(
              '        "quantile", "cor", "cov", "plogis",',
              '        "quantile", "plogis",',
              "polymorphic cor/cov")
          replace_once(
              '        "seq", "seq_len", "seq_along", "sample", "sample.int",',
              '        "seq", "seq_len", "seq_along", "sample.int",',
              "polymorphic sample")
          replace_once(
              '        "length", "nrow", "ncol", "which", "match", "findInterval", "uniroot", "optimize",',
              '        "length", "nrow", "ncol", "which", "match", "findInterval",',
              "list optimizers")
          replace_once(
              '    if name in list_calls:\n        return ReturnInfo("list", ["list"], [], compact, "terminal-call")\n',
              '    if name in list_calls:\n        return ReturnInfo("list", ["list"], [], compact, "terminal-call")\n    if name in {"uniroot", "optimize"}:\n        return ReturnInfo("list", ["list"], [], compact, "terminal-call")\n    if name in {"sample", "cor", "cov"}:\n        return ReturnInfo("object", [], [], compact, "terminal-call-polymorphic")\n',
              "special call typing")
          replace_once(
              '    if name == "structure" and cls:\n        comps = list_components(expr)\n        kind = "data.frame" if "data.frame" in cls else ("list" if "list(" in expr else "classed")\n        return ReturnInfo(kind, cls, comps, compact, "terminal-class")\n',
              '    if name == "structure" and cls:\n        comps = list_components(expr)\n        kind = "data.frame" if "data.frame" in cls else ("list" if "list(" in expr else "classed")\n        return ReturnInfo(kind, cls, comps, compact, "terminal-class")\n    if name == "structure" and not cls:\n        comps = list_components(expr)\n        return ReturnInfo("list" if "list(" in expr else "classed", [], comps, compact, "terminal-dynamic-class")\n',
              "dynamic class fallback")

          structured = textwrap.indent(textwrap.dedent(r'''
          # Preserve structured terminal subsetting before arithmetic-token
          # heuristics; e.g. order(-score) does not make the return numeric.
          subset = re.match(r"^([A-Za-z.][A-Za-z0-9._]*)\s*\[", expr)
          if subset:
              base = subset.group(1)
              if base in assigns:
                  base_info = infer_expr(assigns[base], assigns, funcs, seen)
                  if base_info.kind in {"data.frame", "matrix", "array", "tabular"}:
                      return ReturnInfo(base_info.kind, base_info.classes, base_info.components, compact, "terminal-subset")
              if re.search(r"\bdrop\s*=\s*FALSE\b", expr):
                  return ReturnInfo("tabular", [], [], compact, "terminal-subset")
              return ReturnInfo("object", [], [], compact, "terminal-subset")

          # Infer simple terminal if/else expressions from both value branches.
          if expr.startswith("if ") or expr.startswith("if("):
              simple_if = re.match(r"^if\s*\((.*?)\)\s*(.*?)\s+else\s+(.*)$", expr, re.S)
              if simple_if:
                  infos = [infer_expr(simple_if.group(i).strip(), assigns, funcs, seen) for i in (2, 3)]
                  non_null = [x for x in infos if x.kind != "null"]
                  kinds = {x.kind for x in non_null}
                  if len(kinds) == 1 and non_null:
                      x = non_null[0]
                      return ReturnInfo(x.kind, x.classes, x.components, compact, "conditional")
          ''').strip("\n"), "    ") + "\n\n"
          replace_once(
              '    # Arithmetic/comparison expressions are common terminal expressions.\n',
              structured + '    # Arithmetic/comparison expressions are common terminal expressions.\n',
              "structured terminal inference")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate analyzer syntax and regression semantics
        run: |
          python -m py_compile tools/cran_return_docs_v2.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          p = Path("tools/cran_return_docs_v2.py")
          spec = importlib.util.spec_from_file_location("cran_return_docs_v2_test", p)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          funcs = {}
          checks = {
              "dynamic_classes": mod.classes_in('structure(x, class = c(paste0("eye_irt_", type, "_channel"), "eye_irt_channel"))'),
              "literal_classes": mod.classes_in('structure(x, class = c("a", "b"))'),
              "as_integer": mod.infer_expr('as.integer(4)', {}, funcs, set()).kind,
              "uniroot": mod.infer_expr('uniroot(f, c(0, 1))', {}, funcs, set()).kind,
              "sample": mod.infer_expr('sample(x)', {}, funcs, set()).kind,
              "table_subset": mod.infer_expr('s[order(-s$score), , drop = FALSE]', {"s": 'data.frame(a = 1)'}, funcs, set()).kind,
              "inline_if": mod.infer_expr('if (length(z)) mean(z) else NA_real_', {}, funcs, set()).kind,
          }
          print("SEMANTIC_REGRESSION_VALUES=", checks)
          assert checks["dynamic_classes"] == []
          assert checks["literal_classes"] == ["a", "b"]
          assert checks["as_integer"] == "numeric"
          assert checks["uniroot"] == "list"
          assert checks["sample"] == "object"
          assert checks["table_subset"] == "data.frame"
          assert checks["inline_if"] == "numeric"
          print("SEMANTIC_REGRESSION_TESTS=PASS")
          PY

      - name: Commit hardening and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cran-return-analyzer-hardening.yml
          git add tools/cran_return_docs_v2.py
          git diff --cached --check
          git commit -m "fix: harden CRAN return inference semantics"
          git push origin HEAD:cran-remediation-0.11.1
