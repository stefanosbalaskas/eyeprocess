name: Apply CRAN source remediation

on:
  push:
    branches:
      - cran-remediation-0.11.1
    paths:
      - tools/apply_cran_source_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic source fixes
        run: python tools/apply_cran_source_fixes.py
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit generated remediation
        run: |
          if git diff --quiet; then
            echo "No source remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove CRAN global-state and installer violations"
          git push origin HEAD:cran-remediation-0.11.1
