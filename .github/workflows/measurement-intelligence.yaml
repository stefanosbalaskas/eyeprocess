name: measurement-intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/03*.R'
      - 'R/04*.R'
      - 'tests/testthat/helper-measurement-intelligence.R'
      - 'tests/testthat/test-*.R'
      - 'vignettes/*.Rmd'
      - 'man/03*.Rd'
      - 'man/04*.Rd'
      - 'inst/extdata/measurement-intelligence-api-inventory.csv'
      - 'inst/scripts/run-measurement-intelligence-validation.R'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '_pkgdown.yml'

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['release', 'devel']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          extra-repositories: https://stan-dev.r-universe.dev
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - name: Parse measurement-intelligence modules
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "^(03[0-9]|04[0-7]).*\\.[Rr]$", full.names = TRUE)
          invisible(lapply(files, parse))
          message("Parsed ", length(files), " measurement-intelligence modules.")
      - name: Run measurement-intelligence tests
        shell: Rscript {0}
        run: |
          testthat::test_dir(
            "tests/testthat",
            filter = "probabilistic|compositional|uncertainty|calibration|reliability|device|pupil|missingness|recurrence|point-process|scanpath|episodes|item-bank|process-dif|process-norms|evidence|measurement-intelligence",
            reporter = "summary",
            stop_on_failure = TRUE,
            stop_on_warning = TRUE
          )
      - name: Package check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
